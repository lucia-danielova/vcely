services:
  database:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: agrogis
      POSTGRES_USER: agrogis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - agrogis-postgis:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrogis -d agrogis"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agrogis-postgis:
