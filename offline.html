<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#047857">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Včely a pôda | Offline</title>
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #15301f;
      --muted: #52645c;
      --leaf: #047857;
      --mint: #eaf3e2;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      background: var(--mint);
      color: var(--ink);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(255,255,255,.9), transparent 60%),
        linear-gradient(160deg, #f4f8ec 0%, #e7f1e3 45%, #eef6ea 75%, #fbf6e6 100%);
    }
    main {
      width: min(100%, 440px);
      text-align: center;
      padding: 28px 22px;
      border-radius: 28px;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(255,255,255,.8);
      box-shadow: 0 24px 50px -28px rgba(15,42,28,.4);
      backdrop-filter: blur(16px);
    }
    img { width: 88px; height: 88px; border-radius: 22px; }
    h1 { margin: 18px 0 8px; font-size: 1.45rem; letter-spacing: -0.02em; }
    p { margin: 0; line-height: 1.6; color: var(--muted); font-size: .95rem; }
    button {
      margin-top: 22px;
      border: 0;
      border-radius: 14px;
      padding: 13px 18px;
      background: var(--leaf);
      color: #fff;
      font: inherit;
      font-weight: 800;
      width: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="./assets/icon-192.png" alt="">
    <h1>Ste offline</h1>
    <p>Mapa, registre a aktuálne údaje potrebujú pripojenie. Shell aplikácie ostáva nainštalovaný — skúste to znova po obnovení siete.</p>
    <button type="button" onclick="window.location.reload()">Skúsiť znova</button>
  </main>
</body>
</html>
